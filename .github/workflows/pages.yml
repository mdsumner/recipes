name: Build and deploy site

on:
  push:
    branches: [main]
    paths: ["recipes/**", "site/**", "harvest/**", ".github/workflows/pages.yml"]
  # Commits made by the harvest workflow use GITHUB_TOKEN and do not fire
  # push events, so rebuild when that workflow finishes instead.
  workflow_run:
    workflows: ["Harvest recipe from issue"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r site/requirements.txt
      - run: python site/build.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
