name: Tests

on:
  push:
    paths: ["harvest/**", "tests/**", "requirements*.txt", ".github/workflows/test.yml"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Files are ASCII
        run: |
          bad=$(grep -rlP '[^\x00-\x7F]' recipes data harvest --include='*.md' --include='*.json' --include='*.py' || true)
          if [ -n "$bad" ]; then echo "non-ASCII content in:"; echo "$bad"; exit 1; fi
