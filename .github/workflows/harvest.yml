name: Harvest recipe from issue

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    # Only issues created from the "Add a recipe" form, by people with a role on the repo.
    if: >-
         contains(github.event.issue.body, '### Recipe URL') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Parse issue form
        id: form
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python .github/scripts/parse_issue.py >> "$GITHUB_OUTPUT"

      - name: Harvest
        id: harvest
        env:
          URL: ${{ steps.form.outputs.url }}
          SLUG: ${{ steps.form.outputs.slug }}
          FORCE: ${{ steps.form.outputs.force }}
        run: |
          set +e
          args=("$URL")
          [ -n "$SLUG" ] && args+=(--slug "$SLUG")
          [ "$FORCE" = "true" ] && args+=(--force)
          out=$(python -m harvest "${args[@]}" 2>err.txt)
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "line=$out" >> "$GITHUB_OUTPUT"
          {
            echo "err<<EOF"
            cat err.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit
        if: steps.harvest.outputs.code == '0'
        id: commit
        run: |
          git config user.name "recipes-harvest[bot]"
          git config user.email "recipes-harvest@users.noreply.github.com"
          git add recipes data README.md
          slug=$(echo "${{ steps.harvest.outputs.line }}" | cut -f1)
          git commit -m "Add $slug (closes #${{ github.event.issue.number }})" \
                     -m "Source: ${{ steps.form.outputs.url }}" \
                     -m "Requested by @${{ github.event.issue.user.login }}"
          git push origin HEAD:main
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Report success
        if: steps.harvest.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.commit.outputs.slug }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body \
            "Harvested to [recipes/$SLUG.md](https://github.com/${{ github.repository }}/blob/main/recipes/$SLUG.md). Edit it in place if the parse needs tidying."
          gh issue close ${{ github.event.issue.number }} --reason completed

      - name: Report failure
        if: steps.harvest.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.harvest.outputs.code }}
          ERR: ${{ steps.harvest.outputs.err }}
        run: |
          case "$CODE" in
            2) label=needs-manual; msg="No schema.org Recipe data found on that page, so it needs a hand-written entry (or a different URL for the same recipe)." ;;
            3) label=exists; msg="A recipe with that file name already exists. Tick the overwrite box, or set a different file name, and edit the issue to retry." ;;
            *) label=harvest-failed; msg="The harvester failed. Edit the issue to retry, or add the recipe by hand." ;;
          esac
          gh label create "$label" --force --color d73a4a >/dev/null 2>&1 || true
          gh issue edit ${{ github.event.issue.number }} --add-label "$label"
          printf '%s\n\n```\n%s\n```\n' "$msg" "$ERR" > comment.md
          gh issue comment ${{ github.event.issue.number }} --body-file comment.md
